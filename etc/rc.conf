# /etc/rc.conf: this system's settings, after the defaults.

if [ -r /etc/defaults/rc.conf ]; then
        . /etc/defaults/rc.conf
fi

rc_configured=YES

# QEMU's user-mode network, on the virtio-net device, its address and
# default route from QEMU's DHCP server (10.0.2.15/24, by 10.0.2.2).
# Statically: ifaddr_vionet0="10.0.2.15/24" and defaultroute="10.0.2.2".
net_interfaces="vionet0"
ifaddr_vionet0="DHCP"
