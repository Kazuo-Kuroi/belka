# /etc/dhcpcd.conf: dhcpcd(8)'s settings (see dhcpcd.conf(5)), for the
# interfaces /etc/rc.d/dhcpcd leases addresses on (ifaddr_<name>="DHCP"
# in /etc/rc.conf). Belka's dhcpcd is IPv4 only.

# The hook (/libexec/dhcpcd-run-hooks, Belka's) keeps the name servers a
# lease offers in /var/db/dhcpcd/<interface>.dns, for dnscache to forward
# to if dnscache_forwarders="DHCP"; /etc/resolv.conf keeps naming
# dnscache, 127.0.0.1.

# Identify this host by a DUID (RFC 4361), kept in /var/db/dhcpcd/duid.
duid

# Leave the address and routes in place when dhcpcd exits.
persistent

# Send no vendor class (dhcpcd-<version>:<os>:<machine>).
vendorclassid

# What to ask the server for.
option domain_name_servers, domain_name, domain_search, host_name
option classless_static_routes, static_routes

# A server must say who it is (RFC 2131).
require dhcp_server_identifier
