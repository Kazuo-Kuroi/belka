#
# /etc/routed/static_route.conf: the static routes, which
# /etc/rc.d/staticroute adds at boot with netcfg(8). A route a line:
#
#	destination	gateway
#
# The destination is a network, address/length, or default; the gateway
# must be on a network an interface is attached to. A # begins a comment.
# The default route may be given here or by defaultroute in /etc/rc.conf,
# but not both.
#
# For example:
#
#	192.168.10.0/24	10.0.2.2
