# /etc/defaults/rc.conf: the default settings for /etc/rc. Do not edit
# this file; override settings in /etc/rc.conf.

rc_configured=NO        # set to YES in /etc/rc.conf once configured

# rcorder flags for /etc/rc (say "-s nofoo" to skip scripts with KEYWORD nofoo).
rc_rcorder_flags=""

# The host name; empty: the first line of /etc/myname, if there is one.
hostname=""

# The network (/etc/rc.d/network): IP under UDP and TCP; the interfaces
# to attach, each with ifaddr_<name>="address/length" or "DHCP"; the
# gateway for the default route, if any; and whether to forward
# datagrams for others, as a router does.
network=YES
net_interfaces=""
defaultroute=""
ip_forwarding=NO

# Leased addresses (/etc/rc.d/dhcpcd), dhcpcd(8) on the interfaces whose
# ifaddr_<name> is "DHCP": how long to wait for a lease at boot before
# going on (dhcpcd keeps trying), and other flags for it.
dhcpcd=YES
dhcpcd_timeout=30
dhcpcd_flags=""

# Static routes (/etc/rc.d/staticroute), from /etc/routed/static_route.conf.
staticroute=YES

# The caching resolver (/etc/rc.d/dnscache), djbdns' dnscache: where it
# listens, its cache's size in bytes, the servers it forwards to rather
# than resolving from the root servers itself (addresses, or "DHCP": the
# ones the leases offer; empty: none), and where its log of queries goes.
dnscache=YES
dnscache_ip="127.0.0.1"
dnscache_cachesize=1000000
dnscache_forwarders=""
dnscache_log="/dev/null"
# The SSH server (/etc/rc.d/sshd), Dropbear's: the types of host key it
# makes the first time (also rsa; ecdsa and ed25519 are quick to make),
# whether it runs as a daemon of its own rather than under inetd, and
# its flags then (as /etc/inetd.conf's: no root logins by password).
sshd=YES
sshd_hostkeys="ed25519 ecdsa"
sshd_standalone=NO
sshd_flags="-g"
# The TCP services of /etc/inetd.conf (/etc/rc.d/inetd), each under
# tcpserver: the address they listen on (0: all of this host's), the
# flags for every tcpserver (-R: no ident lookups; -H and -l0: no name
# lookups; -D: no Nagle delay), and where their log of connections goes.
inetd=YES
inetd_address="0"
inetd_flags="-RHDl0"
inetd_log="/dev/null"
