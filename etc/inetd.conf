# /etc/inetd.conf: the TCP services /etc/rc.d/inetd starts, each under
# its own tcpserver(1), one to a line:
#
#       name    port    user    program [argument ...]
#
# A connection to port runs program as user, its standard input and
# output the connection. Who may connect is in /etc/inetd/<name>.rules,
# if there is one, in tcprules(1)'s form (for example "10.0.2.:allow"
# then ":deny"); without one, anyone may. inetd_flags (/etc/rc.conf)
# are given to every tcpserver.

# The SSH server, Dropbear's, for one connection (-i); no logins as root
# by password (-g), as OpenSSH's prohibit-password.
ssh     22      root    /usr/sbin/sshd -i -g
