[binaries]
c = ['sh', '/usr/src/mlibc-build/illumos-cc', '/usr/bin/ld', 'gcc']
cpp = ['sh', '/usr/src/mlibc-build/illumos-cc', '/usr/bin/ld', 'g++']
ar = 'ar'
[built-in options]
cpp_args = ['-fno-gnu-unique', '-D_GNU_SOURCE']
c_link_args = ['@LIBGCC@']
cpp_link_args = ['@LIBGCC@']

[host_machine]
system = 'belka'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
