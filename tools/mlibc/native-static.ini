[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'ar'
[built-in options]
c_args = ['-fno-pic']
cpp_args = ['-fno-pic', '-fno-gnu-unique', '-D_GNU_SOURCE']

[host_machine]
system = 'belka'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
